<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play TV</title>
  <meta name="description" content="Player de IPTV: canais ao vivo, filmes e séries a partir das suas playlists M3U ou login Xtream.">
  <meta name="theme-color" content="#0d0b14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-logo">
      <img src="icon.svg" alt="" width="96" height="96">
      <div class="splash-name">Play<span>TV</span></div>
    </div>
    <div class="spinner" aria-label="Carregando"></div>
    <div class="splash-ver" id="splashVer"></div>
  </div>

  <!-- Conteúdo -->
  <div id="view" class="view"></div>

  <!-- Menu lateral -->
  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer" aria-label="Menu">
    <div class="drawer-brand"><img src="icon.svg" alt="" width="40" height="40"><span>Play<b>TV</b></span></div>
    <button class="drawer-profile" id="drawerProfile">
      <span class="avatar" id="drawerAvatar"></span>
      <span><b id="drawerName">Meu perfil</b><small>Trocar de perfil</small></span>
    </button>
    <nav class="drawer-nav" id="drawerNav"></nav>
    <div class="drawer-foot">
      <small>ID DO APARELHO</small>
      <code id="deviceId"></code>
      <small id="appVer"></small>
    </div>
  </aside>

  <!-- Barra inferior -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Navegação"></nav>

  <!-- Player -->
  <div id="player" class="player hidden" role="dialog" aria-label="Player">
    <video id="video" playsinline controls autoplay></video>
    <div class="p-top" id="pTop">
      <button class="icon-btn" id="pBack" aria-label="Voltar"></button>
      <div class="p-title"><img id="pLogo" alt=""><div><b id="pName"></b><small id="pSub"></small></div></div>
      <div class="p-actions" id="pActions"></div>
    </div>
    <div id="pMsg" class="p-msg hidden"></div>
    <div id="pToast" class="p-toast hidden"></div>
  </div>

  <!-- Perfis -->
  <dialog id="dlgProfiles">
    <div class="dlg">
      <div class="dlg-head"><h2>Quem está assistindo?</h2><button class="btn" data-close>Fechar</button></div>
      <div class="profiles" id="profileList"></div>
      <form class="row-form" id="profileForm">
        <input name="pname" placeholder="Nome do novo perfil" maxlength="20" required>
        <button class="btn primary">Criar</button>
      </form>
    </div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/1.7.3/mpegts.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
